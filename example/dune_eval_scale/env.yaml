world:
  height: 42
  width: 42
  step_time: 0.1
  sample_time: 0.1
  offset: [5, 5]
  collision_mode: 'stop'  # 'stop', 'unobstructed', 'reactive'
  control_mode: 'auto'  # 'keyboard', 'auto'

robot:
  - kinematics: {name: 'acker', mode: 'steer'}
    shape: 
      name: 'multipolygon'
      vertices_list: [
        # car
        # [[-0.5, 0.74], [2.85, 0.74], [2.85, -0.74], [-0.5, -0.74]],
        # [[-0.25, 0.37], [1.425, 0.37], [1.425, -0.37], [-0.25, -0.37]],
        [[-1, 1], [1, 1], [1, -1], [-1, -1]],
        [[-0.5, 0.5], [0.5, 0.5], [0.5, -0.5], [-0.5, -0.5]],
        # # mower
        # [[-1.84, 0.75], [-0.84, 0.75], [-0.84, -0.75], [-1.84, -0.75]]
        # # single pruner
        # [[2.69, -0.299], [3.27, -0.299], [3.27, -1.499], [2.69, -1.499]]
        # # kms sprayer
        # [[-2.1, 0.5], [-1.1, 0.5], [-1.1, -0.5], [-2.1, -0.5]],
        # [[-1.0, 2.15], [-0.5, 2.15], [-0.5, -2.15], [-1.0, -2.15]]
        # double pruner
        # [[3.259, -0.175], [3.559, -0.175], [3.559, -1.5], [3.259, -1.5]],
        # [[3.259, 0.175], [3.559, 0.175], [3.559, 1.5], [3.259, 1.5]]    
      ]
      wheelbase: 1.9
    state: [30, 8.75, 0.09, 0] # mower, single pruner, double pruner
    # state: [-0.3, 8.75, -3.1416, 0] # kms sprayer
    # goal: [0.5, 3.75, 0] # mower
    # goal: [-3.2, 3.75, 0] # single pruner, double pruner
    goal: [0.5, 3.75, 0] # kms sprayer
    vel_max: [2.0, 0.55]
    vel_min: [-2.0, -0.55] 
    acce: [1.0, 1.0]
    behavior: {name: 'dash'}
    arrive_mode: 'state'
    goal_threshold: 0.2
    angle_tolerance: 0.1
    description: 'None'
    plot:
      show_trail: True
      trail_fill: False
      trail_alpha: 0.5
      trail_color: 'b'
      show_trajectory: False
      show_goal: False

    sensors: 
      - type: 'lidar2d'
        range_min: 0
        range_max: 100
        angle_range: 6.283
        number: 100
        noise: False
        offset: [0, 0, 0]
        alpha: 0.3

obstacle:
  - number: 11
    distribution: {name: 'manual'}
    shape:
      - {name: 'polygon', random_shape: true, center_range: [0, 0, 0, 0], avg_radius_range: [0.5, 1.0], irregularity_range: [0.9, 1.0]}  # radius

    state: [[20, 34], [31, 38], [9.5, 20], [40, 26], [18.5, 18.5], [16, 26], [10, 24], [15, 20], [16, 26], [19, 26], [11, 15], [14, 15]]


