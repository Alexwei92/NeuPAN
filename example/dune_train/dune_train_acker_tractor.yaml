robot:
  kinematics: 'acker'
  # length: 3.35
  # width: 1.48
  vertices: [[-0.5, 0.74], [2.85, 0.74], [2.85, -0.74], [-0.5, -0.74]]
  wheelbase: 1.9

train:
  direct_train: true
  data_size: 100000
  data_range: [-25, -25, 25, 25]
  batch_size: 256
  epoch: 5000
  valid_freq: 250
  save_freq: 500
  lr: 5e-5
  lr_decay: 0.5
  decay_freq: 1500
