world:
  height: 20
  width: 30
  step_time: 0.1
  sample_time: 0.1
  offset: [-15, -5]
  collision_mode: 'stop'
  control_mode: 'auto'
  obstacle_map: 'headland_rect/acker/headland_map.png'
  mdownsample: 1

robot:
  - kinematics: {name: 'acker', mode: 'steer'}
    shape: {name: 'polygon', vertices: [[-0.5, 0.74], [2.85, 0.74], [2.85, -0.74], [-0.5, -0.74]], wheelbase: 1.9}
    state: [1.5, 8.75, -3.1416, 0]
    goal: [0.6, 3.75, 0]
    vel_max: [2.0, 0.55]
    vel_min: [-2.0, -0.55] 
    # acce: [1.0, 1.0]
    behavior: {name: 'dash'}
    arrive_mode: 'state'
    goal_threshold: 0.2
    angle_tolerance: 0.1
    description: 'None'
    plot:
      show_trail: True
      trail_fill: False
      trail_alpha: 0.5
      trail_color: 'b'
      show_trajectory: False
      traj_color: 'g'
      show_goal: True

    sensors: 
      - type: 'lidar2d'
        range_min: 0
        range_max: 10
        angle_range: 6.283
        number: 100
        noise: False
        offset: [0, 0, 0]
        alpha: 0.3

