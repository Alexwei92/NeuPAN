  height: 42
  width: 42
  step_time: 0.1
  sample_time: 0.1
  offset: [5, 5]
  collision_mode: 'unobstructed'
  control_mode: 'auto'
  # obstacle_map: 'headland_map.png'
  # mdownsample: 1
  

robot:
  - kinematics: {name: 'acker', mode: 'steer'}
    shape: 
      name: 'multipolygon'
      vertices_list: [
        # car
        [[-0.5, 0.74], [2.85, 0.74], [2.85, -0.74], [-0.5, -0.74]],
      #   # # mower
      #   # [[-1.84, 0.75], [-0.84, 0.75], [-0.84, -0.75], [-1.84, -0.75]]
      #   # # single pruner
      #   # [[2.69, -0.299], [3.27, -0.299], [3.27, -1.499], [2.69, -1.499]]
      #   # kms sprayer
      #   [[-2.1, 0.5], [-1.1, 0.5], [-1.1, -0.5], [-2.1, -0.5]],
      #   [[-1.0, 2.15], [-0.5, 2.15], [-0.5, -2.15], [-1.0, -2.15]]
      #   # # double pruner
      #   # [[3.259, -0.175], [3.559, -0.175], [3.559, -1.5], [3.259, -1.5]],
      #   # [[3.259, 0.175], [3.559, 0.175], [3.559, 1.5], [3.259, 1.5]]    
      ]
      # name: 'polygon'
      # vertices: [[-0.5, 0.74], [2.85, 0.74], [2.85, -0.74], [-0.5, -0.74]]
      wheelbase: 1.9
    # state: [4.0, 8.75, -3.1416, 0] # mower, single pruner, double pruner
    # state: [-0.3, 8.75, -3.1416, 0] # kms sprayer
    # # goal: [0.5, 3.75, 0] # mower
    # # goal: [-3.2, 3.75, 0] # single pruner, double pruner
    # goal: [0.5, 3.75, 0] # kms sprayer
    # state: [10, 42, -1.57, 0] 
    # goal: [40, 12, 0, 0] 
    # state: [10, 42, 1.57, 0] 
    # goal: [40, 40, 0] 
    state: [10, 42, -1.57, 0] 
    goal: [30, 20, 0, 0] 
    vel_max: [2.0, 0.55]
    vel_min: [-2.0, -0.55] 
    acce: [1.0, 1.0]
    behavior: {name: 'dash'}
    arrive_mode: 'state'
    goal_threshold: 0.2
    angle_tolerance: 0.1
    description: 'None'
    plot:
      show_trail: True
      trail_fill: False
      trail_alpha: 0.5
      trail_color: 'b'
      show_trajectory: False
      show_goal: True

    sensors: 
      - type: 'lidar2d'
        range_min: 0
        range_max: 10
        angle_range: 6.283
        number: 100
        noise: False
        offset: [0, 0, 0]
        alpha: 0.3

