world:
  height: 42
  width: 42
  step_time: 0.1
  sample_time: 0.1
  offset: [5, 5]
  collision_mode: 'unobstructed'
  control_mode: 'auto'

robot:
  - kinematics: {name: 'acker', mode: 'steer'}
    shape: 
      name: 'multipolygon'
      vertices_list: [
        # car
        [[-0.5, 0.74], [2.85, 0.74], [2.85, -0.74], [-0.5, -0.74]],
        # # mower
        # [[-1.84, 0.75], [-0.84, 0.75], [-0.84, -0.75], [-1.84, -0.75]]
        # single pruner
        [[2.69, -0.299], [3.27, -0.299], [3.27, -1.499], [2.69, -1.499]]
        # # kms sprayer
        # [[-2.1, 0.5], [-1.1, 0.5], [-1.1, -0.5], [-2.1, -0.5]],
        # [[-1.0, 2.15], [-0.5, 2.15], [-0.5, -2.15], [-1.0, -2.15]]
        # # double pruner
        # [[3.259, -0.175], [3.559, -0.175], [3.559, -1.5], [3.259, -1.5]],
        # [[3.259, 0.175], [3.559, 0.175], [3.559, 1.5], [3.259, 1.5]]    
      ]
      wheelbase: 1.9
    state: [10, 42, 1.57, 0] 
    goal: [40, 40, 0] 
    vel_max: [2.0, 0.55]
    vel_min: [-2.0, -0.55] 
    acce: [1.0, 1.0]
    behavior: {name: 'dash'}
    arrive_mode: 'state'
    goal_threshold: 0.2
    angle_tolerance: 0.1
    description: 'None'
    plot:
      traj_color: 'g'
      show_trajectory: False
      show_trail: True

    sensors: 
      - type: 'lidar2d'
        range_min: 0
        range_max: 10
        angle_range: 6.283
        number: 100
        noise: False
        offset: [0, 0, 0]
        alpha: 0.3
      # - type: 'lidar2d'
      #   range_min: 0
      #   range_max: 10
      #   angle_range: 3.1415926
      #   number: 100
      #   noise: False

obstacle:
  - number: 10
    distribution: {name: 'manual'}
    state: [[20, 34], [31, 38], [10, 20], [41, 25], [20, 13], [16, 26], [10.5, 24.5], [18, 20], [16, 26], [19, 26], [10, 30]]
    shape:
      - {name: 'circle', radius: 1.5}  # radius
      - {name: 'circle', radius: 1.0}  # radius

  - number: 1
    distribution: {name: 'manual'}
    shape:
      - {name: 'polygon', vertices: [[31, 24], [33, 24], [33, 28], [31, 28]]}
    state: 
      - [0, 0, 0] 